# Supabase Auth sets several large session cookies on the OAuth callback.
# Beanstalk's default nginx buffers (4k/8k) reject such response headers with
# "upstream sent too big header" and answer 502, so they are enlarged here.
proxy_buffer_size          64k;
proxy_buffers              8 64k;
proxy_busy_buffers_size    128k;

# Later requests carry those cookies back; allow large request headers too.
large_client_header_buffers 4 32k;
